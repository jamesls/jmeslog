[project]
name = "jmeslog"
version = "0.2.0"
description = "Tool for managing changelogs"
authors = [
  { name = "James Saryerwinnie", email = "js@jamesls.com" },
]
license = "Apache-2.0"
readme = "README.md"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.12.0,<3.15.0"
dependencies = [
  "jinja2>=3.1.6",
  "packaging>=24.0",
]

[project.urls]
Documentation = "https://jamesls.github.io/jmeslog"
Homepage = "https://jamesls.github.io/jmeslog"
Repository = "https://github.com/jamesls/jmeslog"
Issues = "https://github.com/jamesls/jmeslog/issues"
Changelog = "https://github.com/jamesls/jmeslog/blob/master/CHANGELOG.md"

[project.scripts]
jmeslog = "jmeslog.cli:main"

[dependency-groups]
dev = [
  "mkdocs-material>=9.6.20",
  "mkdocstrings>=0.30.0",
  "poethepoet>=0.37.0",
  "pymdown-extensions>=10.16.1",
  "pyright[nodejs]>=1.1.405",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-github-actions-annotate-failures>=0.3.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  ".cruft.json",
  ".github",
  "scripts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jmeslog"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
preview = true

[tool.pytest.ini_options]
addopts = """\
    --cov jmeslog \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""

[tool.coverage.run]
branch = true
source = ["src/"]

[tool.coverage.report]
# Bump this up as we add coverage.
fail_under = 77
exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
exclude_also = [
  "def .*: \\.\\.\\.$",
]

[tool.pyright]
include = ["src", "scripts"]
exclude = ["**/__pycache__"]

reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.12"
pythonPlatform = "All"

[tool.poe.tasks]
check = [
  { cmd = "uv run ruff check ." },
  { cmd = "uv run ruff format --diff ." },
  { cmd = "uv run pyright" },
]
test = "uv run pytest tests/"
stage-release = "uv run python ./scripts/stage-release --output staged-release.zip"
format-code = [
  { cmd = "uv run ruff format ." },
]
auto-check = [
  { cmd = "uv run ruff check --fix ." },
  { cmd = "uv run ruff format ." },
  { cmd = "uv run pyright" },
]
prcheck = ["check", "test"]
